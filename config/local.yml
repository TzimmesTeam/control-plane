http:
  port: 8081
  shutdown_timeout: 15s
database:
  dsn: "postgres://postgres:postgres@localhost:5432/control_plane?sslmode=disable"
nats:
  url: "nats://localhost:4222"
  stream: "CONTROL_PLANE"
  prefix: "calc"
s3:
  endpoint: "localhost:9000"
  region: "us-east-1"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  curated_bucket: "curated"
  artifacts_bucket: "artifacts"
  prepared_prefix: "source=core_banking/"
  prepared_key: ""
run:
  default_portfolio_id: "{snapshot_id}"
  default_report_dttm: "1970-01-01"
  default_curves_uri: "s3://curated/curve_snapshots/default/curves.parquet"
  batch_size: 10000
  max_batches: 10000
  max_attempts: 3
  lease_ttl: 10m
  scan_interval: 2s
  publish_timeout: 5s
