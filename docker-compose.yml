services:
  cp-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cp_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:latest
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set shared http://host.docker.internal:9000 minioadmin minioadmin;
        mc mb --ignore-existing shared/artifacts
    restart: "no"

  control-plane:
    build: .
    environment:
      DB_DSN: "postgres://postgres:postgres@cp-postgres:5432/control_plane?sslmode=disable"
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: host.docker.internal:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      HTTP_PORT: "8080"
    depends_on:
      cp-postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  cp_pgdata:
  nats_data:
