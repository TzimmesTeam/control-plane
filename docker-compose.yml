services:
  cp-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cp_pgdata:/var/lib/postgresql/data
      - ./migrations/0001_control_plane.sql:/docker-entrypoint-initdb.d/0001_control_plane.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./testdata/input:/seed:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/data-lake local/report-store;
        mc cp --recursive /seed/ local/data-lake/input/;
        mc ls --recursive local/data-lake
    restart: "no"

  control-plane:
    build: .
    environment:
      DB_HOST: cp-postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: control_plane
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      HTTP_PORT: "8089"
    depends_on:
      cp-postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8089:8089"
    restart: unless-stopped

volumes:
  cp_pgdata:
  nats_data:
  minio_data:
